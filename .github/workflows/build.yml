name: Build MiniMate

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Configure Stable Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minimate-update.keystore"
          echo "MINIMATE_KEYSTORE_PATH=$RUNNER_TEMP/minimate-update.keystore" >> "$GITHUB_ENV"
          echo "MINIMATE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "MINIMATE_KEYSTORE_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "MINIMATE_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  macos:
    name: Build macOS Companion + CoreAudio Driver
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Companion and Universal CoreAudio Driver
        working-directory: companion/macos
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Build System Installer
        working-directory: companion/macos
        run: |
          chmod +x build-installer.sh Installer/postinstall
          ./build-installer.sh

      - name: Verify Installer Actually Installs
        working-directory: companion/macos
        run: |
          if ! sudo installer -verboseR -pkg dist/MiniMate-Audio-macOS.pkg -target /; then
            sudo tail -n 160 /var/log/install.log
            exit 1
          fi
          test -x "/Applications/MiniMate Audio.app/Contents/MacOS/MiniMateAudio"
          test -f "/Applications/MiniMate Audio.app/Contents/Resources/Mini.png"
          test -x "/Library/Audio/Plug-Ins/HAL/MiniMateAudio.driver/Contents/MacOS/MiniMateAudio"
          test -x "/Library/CoreMediaIO/Plug-Ins/DAL/MiniMateCamera.plugin/Contents/MacOS/MiniMateCamera"
          codesign --verify --deep --strict "/Applications/MiniMate Audio.app"
          codesign --verify --strict "/Library/Audio/Plug-Ins/HAL/MiniMateAudio.driver"
          codesign --verify --strict "/Library/CoreMediaIO/Plug-Ins/DAL/MiniMateCamera.plugin"
          launch_log="$RUNNER_TEMP/minimate-launch.log"
          "/Applications/MiniMate Audio.app/Contents/MacOS/MiniMateAudio" >"$launch_log" 2>&1 &
          launch_pid=$!
          sleep 4
          if ! kill -0 "$launch_pid" 2>/dev/null; then
            cat "$launch_log"
            exit 1
          fi
          kill "$launch_pid"
          wait "$launch_pid" 2>/dev/null || true

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: minimate-audio-macos
          path: companion/macos/dist/MiniMate-Audio-macOS.pkg
          retention-days: 30

  windows:
    name: Build Windows Companion
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows x64
        run: dotnet publish companion/windows/MiniMateAudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o companion/windows/dist/win-x64

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: minimate-audio-windows-x64
          path: companion/windows/dist/win-x64/
          retention-days: 30
